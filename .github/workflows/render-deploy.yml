name: Deploy Portfolio to Render

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

jobs:
  deploy:
    name: Deploy to Render Production
    runs-on: ubuntu-latest
    timeout-minutes: 35

    environment:
      name: production
      url: https://adhil-portfolio.onrender.com

    steps:
      - name: Trigger Render deployment
        id: trigger
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          response=$(curl --fail-with-body --silent --show-error \
            -X POST \
            "https://api.render.com/v1/services/${RENDER_SERVICE_ID}/deploys" \
            -H "Authorization: Bearer ${RENDER_API_KEY}" \
            -H "Content-Type: application/json" \
            -d "{\"commitId\":\"${COMMIT_SHA}\"}")

          deploy_id=$(echo "$response" | jq -r '.id // empty')

          if [ -z "$deploy_id" ]; then
            echo "Could not obtain Render deployment ID."
            exit 1
          fi

          echo "Render deployment triggered."
          echo "deploy_id=$deploy_id" >> "$GITHUB_OUTPUT"

      - name: Wait for Render deployment
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID }}
          DEPLOY_ID: ${{ steps.trigger.outputs.deploy_id }}
        run: |
          set -euo pipefail

          for i in $(seq 1 180); do
            response=$(curl --fail-with-body --silent --show-error \
              "https://api.render.com/v1/services/${RENDER_SERVICE_ID}/deploys/${DEPLOY_ID}" \
              -H "Authorization: Bearer ${RENDER_API_KEY}")

            status=$(echo "$response" | jq -r '.status // empty')

            echo "Render deployment status: ${status:-unknown}"

            case "$status" in
              live)
                echo "Render deployment successful."
                exit 0
                ;;
              build_failed|update_failed|canceled|deactivated)
                echo "Render deployment failed: $status"
                exit 1
                ;;
              created|build_in_progress|pre_deploy_in_progress|update_in_progress)
                sleep 10
                ;;
              *)
                echo "Unexpected Render deployment status: $status"
                exit 1
                ;;
            esac
          done

          echo "Render deployment timed out."
          exit 1
